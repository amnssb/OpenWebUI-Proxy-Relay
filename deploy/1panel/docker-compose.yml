# OpenWebUI-Proxy-Relay —— 1Panel 编排模板（环境变量内联版）
#
# 用法：1Panel → 容器 → 编排 → 创建编排 → 来源选「编辑」，粘贴本文件，
#       直接修改下面 environment 里的密钥与密码，然后启动。
#       无需 .env 文件，1Panel 校验（docker-compose config）不会再报缺变量。
#
# 镜像从 GitHub 源码自动构建，无需手动 clone。

services:
  proxy:
    container_name: openwebui-proxy-relay
    build:
      # #main 为分支，可改成某个 tag 或 commit 以固定版本
      context: https://github.com/amnssb/OpenWebUI-Proxy-Relay.git#main
      dockerfile: Dockerfile
    image: openwebui-proxy-relay:latest
    restart: unless-stopped
    ports:
      - "8080:8000"          # 左边 8080 是宿主机端口，按需修改；右边 8000 固定
    environment:
      # ===== 必填：务必改成你自己的值 =====
      # 会话密钥（≥32 位随机串）。生成：openssl rand -hex 32
      - SESSION_SECRET=change-me-please-a-random-32-char-string
      # JWT 签名密钥（另一串随机值，勿与上面相同）
      - JWT_SECRET=change-me-please-another-random-string
      # 初始管理员（仅首次启动创建，之后改这里无效）
      - DEFAULT_ADMIN_EMAIL=admin@example.com
      - DEFAULT_ADMIN_PASSWORD=change-me-admin-password
      # ===== 可选 =====
      # 数据库位置（默认 SQLite，一般不用动）
      - DATABASE_URL=sqlite+aiosqlite:///./data/proxy.db
      # 反代账号「密码」加密密钥；留空则从 SESSION_SECRET 派生。
      # ⚠️ 添加账号后请勿再改 SESSION_SECRET（或本项），否则已存密码无法解密。
      # - ENCRYPTION_KEY=change-me-optional-encryption-key
      # 转发到目标服务器的请求超时（秒），默认 120
      # - REQUEST_TIMEOUT=120
    volumes:
      # 数据库与数据持久化到编排目录下的 ./data，方便 1Panel 备份
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/auth/login')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # —— 可选：用 1Panel「网站反代」按容器名访问时，取消下面注释 ——
    # networks:
    #   - 1panel-network

# networks:
#   1panel-network:
#     external: true

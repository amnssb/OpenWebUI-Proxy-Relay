# OpenWebUI-Proxy-Relay —— 1Panel 编排（直接从 GitHub 拉取构建）
#
# 关键：build 用「短格式」直接写 Git 地址，docker 会克隆仓库并用其中的 Dockerfile。
# 不要再写 dockerfile: 那一行——否则它会去本地找 Dockerfile 而报错。
#
# 用法：1Panel → 容器 → 编排 → 创建编排 → 来源「编辑」，粘贴本文件，改密钥后启动。
# 需要服务器能访问 GitHub。构建的是 main 分支当前代码。

services:
  proxy:
    container_name: openwebui-proxy-relay
    build: https://github.com/amnssb/OpenWebUI-Proxy-Relay.git#main
    image: openwebui-proxy-relay:latest
    restart: unless-stopped
    ports:
      - "8080:8000"          # 左边 8080 是宿主机端口，按需修改
    environment:
      # ===== 必填：改成你自己的值（openssl rand -hex 32 生成随机串）=====
      - SESSION_SECRET=change-me-please-a-random-32-char-string
      - JWT_SECRET=change-me-please-another-random-string
      - DEFAULT_ADMIN_EMAIL=admin@example.com
      - DEFAULT_ADMIN_PASSWORD=change-me-admin-password
      # ===== 可选 =====
      - DATABASE_URL=sqlite+aiosqlite:///./data/proxy.db
      # ⚠️ 添加账号后请勿再改 SESSION_SECRET，否则已存密码无法解密
      # - ENCRYPTION_KEY=
      # - REQUEST_TIMEOUT=120
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/auth/login')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # 可选：用 1Panel 网站反代按容器名访问时取消注释
    # networks:
    #   - 1panel-network

# networks:
#   1panel-network:
#     external: true

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OpenWebUI Proxy Relay{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">OpenWebUI Proxy</div>
        <div class="nav-links">
            <a href="/admin/dashboard">Dashboard</a>
            <a href="/admin/accounts">Accounts</a>
            <a href="/admin/api-keys">API Keys</a>
            {% if user and user.role == 'admin' %}
            <a href="/admin/users">Users</a>
            {% endif %}
            <a href="/auth/logout" class="nav-logout">Logout</a>
        </div>
        <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">&#9776;</button>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>

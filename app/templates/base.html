<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Proxy Relay{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9889;</text></svg>">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">&#9889;</span>
            <span class="brand-text">Proxy Relay</span>
        </div>
        <div class="sidebar-nav">
            <a href="/admin/dashboard" class="nav-item {% if request.url.path == '/admin/dashboard' %}active{% endif %}">
                <span class="nav-icon">&#9632;</span> 仪表盘
            </a>
            <a href="/admin/accounts" class="nav-item {% if '/accounts' in request.url.path %}active{% endif %}">
                <span class="nav-icon">&#9881;</span> 账号管理
            </a>
            <a href="/admin/api-keys" class="nav-item {% if '/api-keys' in request.url.path %}active{% endif %}">
                <span class="nav-icon">&#128273;</span> API 密钥
            </a>
            {% if user and user.role == 'admin' %}
            <a href="/admin/users" class="nav-item {% if '/users' in request.url.path %}active{% endif %}">
                <span class="nav-icon">&#128100;</span> 用户管理
            </a>
            {% endif %}
        </div>
        <div class="sidebar-footer">
            <a href="/auth/logout" class="nav-item logout">
                <span class="nav-icon">&#9212;</span> 退出登录
            </a>
        </div>
    </nav>
    <div class="mobile-header">
        <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">&#9776;</button>
        <span class="mobile-title">Proxy Relay</span>
    </div>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>

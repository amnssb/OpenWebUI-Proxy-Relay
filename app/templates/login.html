<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — Proxy Relay</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-logo">&#9889;</div>
        <h1>Proxy Relay</h1>
        <p class="login-subtitle">登录以管理代理服务</p>
        {% if error %}
        <div class="alert alert-error">&#9888; {{ error }}</div>
        {% endif %}
        <form method="post" action="/auth/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" placeholder="admin@example.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px">登 录</button>
        </form>
    </div>
</body>
</html>

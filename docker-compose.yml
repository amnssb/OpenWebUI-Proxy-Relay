services:
  proxy:
    build: .
    container_name: openwebui-proxy
    ports:
      - "8000:8000"
    volumes:
      - proxy-data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/proxy.db
      # 命令行用 .env 时这些会被 .env 覆盖；面板里没有 .env 时用右边的默认值，
      # 直接改成你自己的随机串/密码即可（不再因缺少变量而校验失败）
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-random-32-char-string}
      - JWT_SECRET=${JWT_SECRET:-change-me-to-another-random-string}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-change-me}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/auth/login')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  proxy-data:
